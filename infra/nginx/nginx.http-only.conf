# Configuracao TEMPORARIA, apenas para o primeiro deploy (antes de existir
# certificado). Serve o desafio do Let's Encrypt e repassa o resto ao app.
# Depois de emitir o certificado, volte para nginx.conf (ver DEPLOY.md).

events {}

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 2m;

  upstream app { server app:3000; }

  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location ^~ /_next/image { return 404; }

    location / {
      proxy_set_header x-middleware-subrequest "";
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app;
    }
  }
}
