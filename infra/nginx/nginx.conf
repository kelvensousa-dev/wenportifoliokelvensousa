# Nginx de producao (HTTPS).
# Certificados esperados em infra/nginx/certs/fullchain.pem e privkey.pem
# (Let's Encrypt ou certificado de origem do Cloudflare). Enquanto nao houver
# certificado, use infra/nginx/nginx.http-only.conf — veja DEPLOY.md.

worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  server_tokens off;
  keepalive_timeout 30s;

  # Limites contra abuso / ataques de negacao de servico simples.
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=sensitive:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # "Connection: upgrade" apenas quando o cliente pede WebSocket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Se usar Cloudflare na frente do servidor, descomente para que os limites
  # usem o IP real do visitante (e nao o IP do Cloudflare). Lista oficial:
  # https://www.cloudflare.com/ips/
  # set_real_ip_from 173.245.48.0/20;
  # ... (demais faixas do Cloudflare)
  # real_ip_header CF-Connecting-IP;

  upstream app {
    server app:3000;
    keepalive 32;
  }

  # HTTP -> HTTPS (mantendo o desafio do Let's Encrypt acessivel).
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn perip 50;

    # Cabecalho interno do Next.js: se vier de fora, pode ser usado para
    # contornar o middleware de autenticacao (CVE-2025-29927). Sempre descartado.
    proxy_set_header x-middleware-subrequest "";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;

    # Login, cadastro e formularios: limite mais rigido por IP.
    location ~ ^/api/(auth/callback/credentials|auth/register|leads|checkout) {
      limit_req zone=sensitive burst=10 nodelay;
      proxy_pass http://app;
    }

    # Webhooks dos gateways: sem limite agressivo (rajadas legitimas; o Asaas
    # pausa a fila de eventos se receber muitos erros seguidos).
    location ~ ^/api/webhooks/(stripe|asaas)$ {
      proxy_pass http://app;
    }

    # Otimizador de imagens desligado (next.config.mjs): recusa na borda.
    location ^~ /_next/image { return 404; }

    # Arquivos estaticos com hash no nome: cache longo.
    location /_next/static/ {
      proxy_pass http://app;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://app;
    }
  }
}
