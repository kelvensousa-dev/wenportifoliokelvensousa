# Uso em producao:
#   1. cp .env.example .env  e preencha TODOS os valores
#   2. docker compose build
#   3. docker compose up -d
# Detalhes em DEPLOY.md.

x-public-build-args: &public-build-args
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?defina NEXT_PUBLIC_APP_URL no .env}
  NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
  NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
  NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL:-}
  NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
  NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-}
  NEXT_PUBLIC_COMPANY_DOCUMENT: ${NEXT_PUBLIC_COMPANY_DOCUMENT:-}
  NEXT_PUBLIC_COMPANY_ADDRESS: ${NEXT_PUBLIC_COMPANY_ADDRESS:-}

services:
  # Aplica migracoes e sincroniza o catalogo; termina e sai.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args: *public-build-args
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [platform]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args: *public-build-args
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]
    # Sem "ports": a aplicacao so e acessivel pelo Nginx.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # SEGURANCA: a versao anterior publicava "5433:5432" — o banco ficava
    # exposto para a internet inteira. Se precisar acessar do servidor
    # (ex.: Prisma Studio), use apenas a interface local:
    # ports:
    #   - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [platform]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [platform]

  minio:
    # Armazenamento de arquivos para o futuro modulo de releases. O codigo
    # atual ainda nao usa S3, entao o servico so sobe com:
    #   docker compose --profile storage up -d
    # Recomendado: fixar uma tag RELEASE.* especifica em vez de "latest".
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-troque-esta-senha-minio}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks: [platform]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Primeiro deploy sem certificado: NGINX_CONF=nginx.http-only.conf no .env
      - ./infra/nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on: [app]
    restart: unless-stopped
    networks: [platform]

  # Emissao/renovacao do certificado Let's Encrypt (sob demanda, ver DEPLOY.md).
  certbot:
    profiles: ["certbot"]
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - ./infra/nginx/letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_www:

networks:
  platform:
    driver: bridge
